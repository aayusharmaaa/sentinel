<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel — console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c3f4a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2.6'/%3E%3Cpath d='M16 4v4M16 24v4M4 16h4M24 16h4' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<script>document.documentElement.classList.add('js');
  try{const t=localStorage.getItem('sentinel-theme');
    if(t) document.documentElement.setAttribute('data-theme',t);
    else if(matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
body{height:100dvh;overflow:hidden;display:flex}

/* ---------- sidebar ---------- */
aside{position:sticky;top:0;height:100dvh;width:264px;flex-shrink:0;display:none;
  flex-direction:column;border-right:1px solid var(--line);background:var(--canvas-2)}
@media(min-width:1040px){aside{display:flex}}
aside .brandbar{display:flex;align-items:center;height:56px;padding:0 18px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  font-weight:600;letter-spacing:-.02em;font-size:15.5px;color:var(--fg)}
.sidefilters{padding:12px 14px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:999px;padding:8px 14px}
.search input{flex:1;background:none;border:0;color:var(--fg);font-family:var(--font-sans);
  font-size:13.5px;outline:none;min-width:0}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line-strong);background:transparent;color:var(--muted);
  font-family:var(--font-sans);transition:all .14s}
.chip:hover{color:var(--fg)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);
  color:var(--brand-fg);font-weight:540}
.qlist{flex:1;min-height:0;overflow-y:auto}
.row{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;
  border-left:3px solid transparent;transition:background .12s}
.row:hover{background:color-mix(in srgb,var(--fg) 3%,transparent)}
.row.sel{background:var(--surface);border-left-color:var(--neg)}
.row.done{opacity:.52}
.row .r1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.row .r2{font-size:13px;margin-top:5px;color:var(--fg2)}
.row .r2 b{color:var(--neg);font-weight:540}
.row .r3{font-size:12px;margin-top:5px;color:var(--muted)}
.qempty{padding:44px 18px;text-align:center;color:var(--faint);font-size:13px}
aside .foot{border-top:1px solid var(--line);padding:14px 16px}
aside .foot .big{font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--pos)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.bar{position:sticky;top:0;z-index:40;flex-shrink:0;height:56px;display:flex;
  align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--canvas) 85%,transparent);backdrop-filter:blur(18px)}
header.bar .hs{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px;
  color:var(--muted)}
header.bar .hs b{color:var(--fg);font-weight:600}
header.bar .hs .hot b{color:var(--neg)}
.spacer{flex:1}
.tgl{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:999px;border:1px solid var(--line-strong);background:transparent;
  color:var(--muted);cursor:pointer}
.tgl:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 5%,transparent)}
main{flex:1;min-height:0;overflow-y:auto;padding:26px 28px 90px}
main>.inner{max-width:1000px}
.empty{padding:90px 0;text-align:center;color:var(--muted)}

/* ---------- help ---------- */
.help{margin-bottom:18px;padding:20px 22px;border-radius:14px;
  border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);
  background:color-mix(in srgb,var(--accent) 7%,transparent);display:none}
.help.on{display:block}
.help .h1r{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.help h3{font-size:16px;font-weight:600}
.help .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;
  font-size:13px;font-family:var(--font-sans)}
.help p{font-size:13.5px;margin:0 0 10px;color:var(--fg2)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;
  margin-top:12px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px}
.hcard b{display:block;font-size:13.5px;margin-bottom:3px;color:var(--fg)}
.hcard span{font-size:12.5px;color:var(--muted)}

/* ---------- page head ---------- */
.phead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
  padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.phead h1{font-size:25px;font-weight:600;letter-spacing:-.03em}
.phead .sub{margin-top:6px;font-size:13.5px;color:var(--muted)}
.phead .sub .mono{font-size:12.5px}
.viewtabs{display:flex;gap:5px}
.vt{font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line-strong);background:transparent;color:var(--muted);
  font-family:var(--font-sans)}
.vt[aria-pressed=true]{background:var(--surface);color:var(--fg);border-color:var(--accent)}

/* ---------- story + action ---------- */
.story{border-radius:14px;padding:22px;margin-bottom:16px;
  border:1px solid color-mix(in srgb,var(--neg) 28%,transparent);
  background:color-mix(in srgb,var(--neg) 7%,transparent)}
.story.t2{border-color:color-mix(in srgb,var(--warn) 30%,transparent);
  background:color-mix(in srgb,var(--warn) 8%,transparent)}
.story .txt{font-size:18px;line-height:1.48;margin:10px 0 0;font-weight:540;
  letter-spacing:-.014em;color:var(--fg)}
.story .txt b{color:var(--neg);font-weight:700}
.story.t2 .txt b{color:var(--warn)}
.story .why{font-size:13.5px;color:var(--fg2);margin:13px 0 0}
.act{border-radius:14px;padding:20px;margin-bottom:16px;background:var(--surface);
  border:1px solid var(--line-strong);box-shadow:var(--shadow-panel)}
.act .ah{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.act .an{font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--fg)}
.act .ad{font-size:13.5px;color:var(--muted);margin:9px 0 0}
.act .btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.b{font-size:13.5px;font-weight:520;padding:9px 17px;border-radius:999px;cursor:pointer;
  font-family:var(--font-sans);border:1px solid var(--line-strong);
  background:color-mix(in srgb,var(--fg) 4%,transparent);color:var(--fg2);
  transition:all .15s}
.b:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.b.go{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.b.go:hover{background:var(--brand-deep)}
.b.ok{background:color-mix(in srgb,var(--pos) 12%,transparent);color:var(--pos);
  border-color:color-mix(in srgb,var(--pos) 32%,transparent)}
.settled{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;
  padding:13px 16px;border-radius:12px;font-size:13.5px;
  background:color-mix(in srgb,var(--pos) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--pos) 30%,transparent)}
.settled b{color:var(--pos)}

/* ---------- panels ---------- */
.panel{border-radius:14px;margin-bottom:14px;overflow:hidden;background:var(--surface);
  border:1px solid var(--line)}
.panel>.ph{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.panel>.ph b{display:block;font-size:14.5px;font-weight:600;color:var(--fg);
  letter-spacing:-.01em}
.panel>.ph span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.panel .body{padding:6px 18px 14px}

/* the five views of one merchant, stacked */
.idv{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border-radius:12px;overflow:hidden;margin:2px 0 4px}
.idrow{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:14px 17px;
  background:var(--surface);align-items:baseline}
@media(max-width:820px){.idrow{grid-template-columns:1fr;gap:5px}}
.idrow.declared{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.idrow.dissent{background:color-mix(in srgb,var(--neg) 7%,var(--surface))}
.idrow.blind{opacity:.62}
.idrow .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.idrow .k i{width:6px;height:6px;border-radius:50%;background:var(--muted2);
  display:block;flex:none}
.idrow.declared .k i{background:var(--accent)}
.idrow.dissent .k i{background:var(--neg)}
.idrow .val{font-size:14px;color:var(--fg)}
.idrow .val b{font-weight:600}
.idrow .det{font-size:12.8px;color:var(--muted);margin-top:4px}
.idrow .src{position:relative;display:inline-flex;margin-top:6px;z-index:1}
.idrow .src-btn{font-size:10.5px;padding:3px 9px;border-radius:999px;cursor:default;
  border:1px solid var(--line-strong);background:var(--panel);color:var(--muted);
  font-family:var(--font-sans);letter-spacing:.04em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:5px}
.idrow .src-btn::after{content:"▾";font-size:9px;opacity:.7}
.idrow .src-tip{display:none;position:absolute;left:0;top:calc(100% + 8px);
  min-width:200px;max-width:280px;padding:10px 12px;border-radius:10px;z-index:40;
  background:var(--surface);border:1px solid var(--line-strong);
  box-shadow:0 10px 28px rgba(15,23,28,.14);pointer-events:none}
.idrow .src-tip::after{content:"";position:absolute;left:16px;bottom:100%;
  border:6px solid transparent;border-bottom-color:var(--surface);
  filter:drop-shadow(0 -1px 0 var(--line-strong))}
.idrow .src-tip .th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin-bottom:7px}
.idrow .src-tip ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.idrow .src-tip li{font-size:12.5px;color:var(--fg);line-height:1.35;
  padding-left:12px;position:relative}
.idrow .src-tip li::before{content:"";position:absolute;left:0;top:.55em;
  width:5px;height:5px;border-radius:50%;background:var(--accent)}
.idrow.dissent .src-tip li::before{background:var(--neg)}
.idrow .src:hover,.idrow .src:focus-within{z-index:50}
.idrow .src:hover .src-tip,.idrow .src:focus-within .src-tip{display:block}
.idrow.dissent .src-btn{border-color:color-mix(in srgb,var(--neg) 28%,transparent);
  color:color-mix(in srgb,var(--neg) 75%,var(--fg));
  background:color-mix(in srgb,var(--neg) 6%,var(--surface))}
.idrow.declared .src-btn{border-color:color-mix(in srgb,var(--accent) 35%,transparent);
  color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}

.contra{padding:13px 16px;border-radius:10px;margin-bottom:9px;font-size:13.5px;
  background:color-mix(in srgb,var(--neg) 7%,transparent);
  border:1px solid color-mix(in srgb,var(--neg) 24%,transparent)}
.contra .cw{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.contra .cw span{font-size:11.5px;color:var(--neg);font-weight:600}
.contra .cw em{font-style:normal;color:var(--muted);font-size:11.5px}

.conf3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;
  background:var(--line);border-radius:12px;overflow:hidden;margin:4px 0}
.conf3 .c{background:var(--surface);padding:15px 17px}
.conf3 .c .n{font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--fg)}
.conf3 .c .n.warn{color:var(--warn)} .conf3 .c .n.bad{color:var(--neg)}
.conf3 .c .n.ok{color:var(--pos)}
.conf3 .c .d{font-size:12.3px;color:var(--muted);margin-top:6px}

.netviz{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.netnode{font-family:var(--font-mono);font-size:11.5px;padding:5px 11px;
  border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);
  background:var(--panel)}
.netnode.self{border-color:var(--neg);color:var(--neg);font-weight:600;
  background:color-mix(in srgb,var(--neg) 9%,transparent)}

.callq{padding:11px 0;border-bottom:1px solid var(--line)}
.callq:last-child{border-bottom:0}
.callq .who{font-size:11.5px;color:var(--faint);margin-bottom:3px}
.callq .txt{font-size:13.8px}
.callq.merchant .txt{color:var(--fg);font-weight:500}
.guard{margin-top:12px;padding:12px 15px;border-radius:10px;font-size:12.5px;
  color:var(--muted);background:var(--panel);border:1px solid var(--line)}
.guard b{color:var(--fg)}
.guard ul{margin:7px 0 0;padding-left:18px} .guard li{margin-bottom:3px}

.gaterule{margin:12px 0;padding:12px 15px;border-radius:10px;font-size:13.5px;
  color:var(--muted);background:var(--panel);border:1px solid var(--line)}
.gaterule b{color:var(--fg)}
.check{padding:15px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .c1{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.check .cn{font-size:15px;font-weight:600;color:var(--fg);letter-spacing:-.01em}
.check .cq{font-size:13px;color:var(--muted);margin:6px 0 0;font-style:italic}
.check .ca{font-size:14px;margin:6px 0 0}
.check .cs{font-size:12.5px;color:var(--faint);margin:6px 0 0}

/* deviations */
.dev{display:grid;grid-template-columns:1fr 86px 86px 110px 76px;gap:10px 12px;
  padding:11px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13.5px}
.dev:last-child{border-bottom:0}
.dev.head{padding:6px 0 9px;border-bottom:1px solid var(--line-strong)}
@media(max-width:980px){.dev{grid-template-columns:1fr 78px 94px 70px}
  .dev .base{display:none}}
.dev .v,.dev .base{font-family:var(--font-mono);font-size:12.5px;text-align:right;
  font-variant-numeric:tabular-nums}
.dev .base{color:var(--faint)}
.zbar{position:relative;height:18px}
.zbar .z0{position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--line-strong)}
.zbar .fill{position:absolute;top:5px;height:8px;border-radius:99px;
  background:var(--brand-soft);transition:width .4s ease,left .4s ease}
.zbar .fill.hot{background:var(--neg)}
.devlbl{font-size:12px;color:var(--muted);white-space:nowrap}
.devlbl.big{color:var(--neg);font-weight:540}

/* surfaces */
.surfaces{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:1px;background:var(--line)}
.surf{background:var(--surface)}
.surf .sh{padding:14px 17px;border-bottom:1px solid var(--line)}
.surf .sw{font-size:12.5px;color:var(--muted)}
.surf .sv{font-size:14.5px;margin-top:5px;color:var(--fg)}
.shot{position:relative;height:250px;overflow:hidden;background:#fbfbfa;
  border-bottom:1px solid var(--line)}
.shot iframe{position:absolute;top:0;left:0;width:1180px;height:940px;border:0;
  transform:scale(.38);transform-origin:0 0;pointer-events:none;z-index:1}
.shot .cover{position:absolute;inset:0;z-index:2}
.shot .fb{position:absolute;inset:0;z-index:0;display:flex;align-items:center;
  justify-content:center;color:#98a4a8;font-size:12px}
.shot a.open{position:absolute;right:10px;bottom:10px;z-index:3;font-size:12px;
  background:rgba(255,255,255,.94);color:#10262d;padding:6px 12px;border-radius:999px;
  text-decoration:none;border:1px solid rgba(11,42,51,.18);font-weight:520}
.find{padding:13px 17px}
.find>div{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.3px}
.find>div:last-child{border-bottom:0}
.find .fe{display:block;margin-bottom:3px}
.find .fi{display:block;margin-top:3px;color:var(--muted);font-size:12.5px}

/* trace */
.st{display:grid;grid-template-columns:32px 1fr;gap:15px;padding:15px 0;
  border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .n2{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);
  font-size:12px;color:var(--muted)}
.st.key .n2{border-color:var(--neg);color:var(--neg);font-weight:600;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--neg) 12%,transparent)}
.st .did{font-size:14.5px;font-weight:540;color:var(--fg)}
.st .why{color:var(--muted);font-size:13px;margin:5px 0 0;font-style:italic}
.st .ret{font-size:13.8px;margin:6px 0 0}
.st .tool{font-family:var(--font-mono);font-size:11px;color:var(--faint);margin-top:6px}
.keyn{margin-top:10px;padding:11px 14px;border-radius:0 8px 8px 0;font-size:13.3px;
  background:color-mix(in srgb,var(--neg) 8%,transparent);border-left:2px solid var(--neg)}
.stopb{padding:12px 18px;background:var(--panel);border-top:1px solid var(--line);
  font-size:13px;color:var(--muted)}
.stopb b{color:var(--fg)}

.narr{font-size:14.5px;line-height:1.66}
.prov{margin-top:13px;padding:12px 15px;border-radius:10px;font-size:12.8px;
  color:var(--muted);border:1px dashed var(--line-strong)}
.prov b{color:var(--fg)}
.gt{color:var(--muted);font-size:13px}
pre.raw{margin:0;padding:16px 18px;font-family:var(--font-mono);font-size:11.5px;
  color:var(--muted);overflow-x:auto;max-height:66vh;line-height:1.55}

/* ---------- copilot + guided review ---------- */
.copilot{display:none;flex-direction:column;width:min(360px,34vw);flex-shrink:0;
  height:100dvh;border-left:1px solid var(--line);background:var(--canvas-2)}
@media(min-width:1280px){.copilot{display:flex}}
.copilot .chtop{padding:14px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:10px}
.copilot .chtop h2{font-size:14.5px;font-weight:600;letter-spacing:-.02em;margin:0}
.copilot .chtop p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.voice-tog{margin-left:auto;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:999px;padding:6px 10px;font-size:11.5px;font-family:var(--font-sans);
  color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px;flex-shrink:0}
.voice-tog:hover{color:var(--fg)}
.voice-tog.on{border-color:var(--accent);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.voice-tog svg{display:block}
.guide{padding:12px 14px;border-bottom:1px solid var(--line);max-height:38%;overflow-y:auto}
.guide .glabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  margin-bottom:8px}
.gstep{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.gstep:last-child{border-bottom:0}
.gstep:hover{opacity:.92}
.gstep .gn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;
  color:var(--muted);font-family:var(--font-mono)}
.gstep.done .gn{background:var(--pos);border-color:var(--pos);color:#fff}
.gstep.active .gn{border-color:var(--accent);color:var(--accent);font-weight:600}
.gstep .gt{font-size:13px;font-weight:540;color:var(--fg)}
.gstep .gd{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.chlog{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 8px;display:flex;
  flex-direction:column;gap:10px}
.bubble{max-width:100%;padding:10px 12px;border-radius:12px;font-size:13.2px;line-height:1.5}

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words = s => String(s ?? '').replace(/_/g, ' ');
const prose = s => String(s ?? '').replace(/[a-z]+(?:_[a-z]+)+/g, m => m.replace(/_/g, ' '));

const CHANNEL = {
  telemetry:{n:'Payment behaviour',
    q:c => `Do its payments look like other ${words(c)} merchants?`,
    s:'Computed from the payment stream we already hold. Costs nothing, runs on everyone.'},
  storefront:{n:'Website', q:() => 'What kind of business is the live page actually built for?',
    s:'A vision model reads a screenshot. Copy can be laundered; a betting layout cannot.'},
  scripts:{n:'Page code', q:() => 'What third-party code does the checkout load?',
    s:'A betting site has to load an odds feed for the product to work at all.'},
  infrastructure:{n:'Shared setup',
    q:() => 'Does it share rare hosting or payout details with other merchants?',
    s:'Finds rings: several small accounts run by one operator.'},
  page_integrity:{n:'Page tampering',
    q:() => 'Is the page trying to give instructions to our reviewer?',
    s:'Recorded as a suspicion signal. Never followed, and never enough to hold money alone.'},
};
const ANSWER = {
  telemetry:{DISSENT:['Payments look wrong','badge-risk'], AGREES:['Payments look normal','badge-money']},
  storefront:{DISSENT:['Different business','badge-risk'], AGREES:['Matches what they said','badge-money']},
  scripts:{DISSENT:['Foreign code found','badge-risk'], AGREES:['Nothing unusual','badge-money']},
  infrastructure:{DISSENT:['Linked to other accounts','badge-risk'], AGREES:['No links found','badge-money']},
  page_integrity:{TAMPER:['Tampering found','badge-warn'], CLEAN:['No tampering','badge-money']},
};
function answer(ch, verdict, tampered){
  if(ch === 'page_integrity') return ANSWER.page_integrity[tampered ? 'TAMPER' : 'CLEAN'];
  if(verdict === 'BLIND') return ['Not checked yet','badge-mute'];
  return (ANSWER[ch] || {})[verdict]
    || [verdict === 'DISSENT' ? "Doesn't match" : 'Matches',
        verdict === 'DISSENT' ? 'badge-risk' : 'badge-money'];
}
const TIERS = {
  0:{n:'Monitor', a:'No action needed', d:'Nothing to do. The merchant never hears from us.'},
  1:{n:'Recheck soon', a:'Automatic recheck', d:'Requeued on a timer. No analyst time, no merchant contact.'},
  2:{n:'Review — payouts continue', a:'Look into this merchant',
     d:'Worth a look, but only one view disagrees. Their settlements keep running while you review, and they are not contacted.'},
  3:{n:'Ask the merchant', a:'Verify with the merchant',
     d:'One view disagrees and it is the website — enough to ask them directly, not enough to touch their money. Settlements continue, and they can decline and speak to a person.'},
  4:{n:'Restrict payouts & review', a:'Restrict their payouts, then review',
     d:'Two independent views disagree. Settlements are frozen until this is resolved — that stops their incoming money, so it is the decision that has to be right.'},
};
const VIEW_ICON = {declared:'declared', payments:'payments', storefront:'website',
  network:'network', statement:'merchant'};
const FEATURE = {
  round_share_all:'Payments at round amounts',
  round_share_recent:'Payments at round amounts (last 30 days)',
  round_share_drift:'Round amounts — change since before',
  velocity_all:'Repeat use per card',
  velocity_recent:'Repeat use per card (last 30 days)',
  velocity_drift:'Repeat use per card — change since before',
  slope_log_volume:'Growth rate',
  peak_ratio:'Busiest day vs a typical day',
  post_peak_persistence:'Did the spike stay up? (a sale comes back down)',
  refund_rate:'Refund rate', chargeback_rate:'Chargeback rate',
  chargeback_drift:'Chargebacks — change since before',
  ticket_entropy:'Variety of payment amounts',
  night_share:'Payments between midnight and 5am',
  hour_kl:'Time-of-day pattern vs the category',
};
const TOOLNAME = {
  query_transaction_features:'Checked its payment behaviour',
  classify_storefront:'Looked at its website',
  list_third_party_scripts:'Listed the code its page loads',
  find_shared_infrastructure:'Checked for links to other merchants',
};

let queue = [], filtered = [], selected = null, view = 'case', rulings = {};
const filter = {tier:'open', text:''};
const cache = new Map();

$('tgl').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('sentinel-theme', next); }catch(e){}
};

async function boot(){
  try{
    [queue, rulings] = await Promise.all([
      (await fetch('/api/queue')).json(),
      fetch('/api/decisions').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    ]);
  }catch(e){
    $('main').innerHTML = `<div class="empty">Could not load the queue.<br>
      Run <span class="mono">python -m sentinel.pipeline</span> first.</div>`;
    return;
  }
  if(localStorage.getItem('sentinel-help') !== 'dismissed') showHelp(true);
  $('helpbtn').onclick = () => showHelp(!document.querySelector('.help.on'));
  $('q').oninput = e => { filter.text = e.target.value.toLowerCase().trim(); apply(); };
  paintHeader(); apply();
  if(filtered.length) select(filtered[0].merchant_id);
}
let helpOn = false;
function showHelp(on){ helpOn = on; if(selected) reselect(); }
function helpHTML(){
  return `<div class="help${helpOn ? ' on' : ''}">
    <div class="h1r"><h3>What you're looking at</h3>
      <button class="x" id="helpclose">Dismiss ✕</button></div>
    <p>Every merchant in the queue was approved at onboarding and has since done something
      that doesn't match what it said it was. Your job is to decide whether that's real.</p>
    <p><b>Use the Case copilot</b> (right panel, or press <span class="mono">?</span>) to ask
      why a case was queued, whether a hold is justified, or to draft a decision note —
      grounded only in structured findings, never in the merchant's page copy.</p>
    <p><b>Sentinel doesn't score merchants — it looks for contradictions.</b> It builds five
      independent readings of the same business and finds where they disagree. Money is only
      held when the website reading <em>and</em> at least one other both contradict the
      declaration. Plenty of honest businesses look odd on one reading; that is exactly why
      one is never enough.</p>
    <div class="hgrid">
      <div class="hcard"><b>Declared</b><span>What the merchant told Razorpay when it
        signed up.</span></div>
      <div class="hcard"><b>Payment behaviour</b><span>Do its payments look like other
        merchants in the same category?</span></div>
      <div class="hcard"><b>Website</b><span>What kind of business is the live page
        actually built for — homepage and checkout?</span></div>
      <div class="hcard"><b>Network</b><span>Is it linked to other accounts by a shared
        bank beneficiary, payout account or device?</span></div>
      <div class="hcard"><b>The merchant itself</b><span>What does it say when an automated
        call asks what it sells? It can decline.</span></div>
    </div></div>`;
}

function paintHeader(){
  const open = queue.filter(r => !rulings[r.merchant_id]);
  const held = open.filter(r => r.settlements_held).length;
  const inj = open.filter(r => r.injection_flagged).length;
  $('hstat').innerHTML = `<span><b>${open.length}</b> waiting on you</span>
    <span class="hot"><b>${held}</b> with payouts frozen</span>
    ${inj ? `<span><b>${inj}</b> sites tried to instruct the reviewer</span>` : ''}`;
  $('frozen').textContent = held;
  $('frozensub').textContent = `of ${open.length} open cases`;
  const counts = {open:open.length, 3:0, 2:0, done:queue.length - open.length};
  open.forEach(r => counts[r.tier] = (counts[r.tier] || 0) + 1);
  $('chips').innerHTML = [['open', `Waiting · ${counts.open}`],
    ['4', `Frozen · ${counts[4] || 0}`], ['3', `Verify · ${counts[3] || 0}`],
    ['2', `Review · ${counts[2] || 0}`],
    ['done', `Decided · ${counts.done}`]]
    .map(([k, l]) => `<button class="chip" data-t="${k}" aria-pressed="${k === filter.tier}">${esc(l)}</button>`).join('');
  $('chips').onclick = e => {
    const b = e.target.closest('.chip'); if(!b) return;
    filter.tier = b.dataset.t;
    [...$('chips').children].forEach(c => c.setAttribute('aria-pressed', c.dataset.t === filter.tier));
    apply();
  };
}

function apply(){
  filtered = queue.filter(r => {
    const done = !!rulings[r.merchant_id];
    const tierOk = filter.tier === 'done' ? done : filter.tier === 'open' ? !done
      : (!done && String(r.tier) === filter.tier);
    const txt = !filter.text || r.merchant_id.toLowerCase().includes(filter.text)
      || r.declared_category.toLowerCase().includes(filter.text)
      || (r.vision_vertical || '').toLowerCase().includes(filter.text)
      || (r.brief || '').toLowerCase().includes(filter.text);
    return tierOk && txt;
  });
  $('qhint').textContent = `${filtered.length} shown · ↑ ↓ to move`;
  $('rows').innerHTML = filtered.length ? filtered.map(r => {
    const done = rulings[r.merchant_id];
    const other = r.vision_vertical && r.vision_vertical !== r.declared_category;
    return `<div class="row${r.merchant_id === selected ? ' sel' : ''}${done ? ' done' : ''}"
        data-id="${esc(r.merchant_id)}" role="button" tabindex="0">
      <div class="r1"><span class="mono" style="font-size:12.5px;color:var(--fg)">${esc(r.merchant_id)}</span>
        <span class="badge ${done ? 'badge-money' : r.tier >= 4 ? 'badge-risk'
          : r.tier === 3 ? 'badge-warn' : 'badge-mute'}">${
          done ? 'Decided' : r.tier >= 4 ? 'Payouts frozen'
          : r.tier === 3 ? 'Verify' : 'Review only'}</span></div>
      <div class="r2">Signed up as ${esc(words(r.declared_category))}${
        other ? `, website reads <b>${esc(words(r.vision_vertical))}</b>` : ''}</div>
      <div class="r3"><span class="urg ${esc(r.urgency || 'medium')}"></span>
        ${(r.dissenting_channels || []).length} of 5 views disagree${
        r.injection_flagged ? ' · page tried to instruct the reviewer' : ''}</div>
      ${r.brief ? `<div class="brief">${esc(r.brief)}</div>` : ''}</div>`;
  }).join('') : `<div class="qempty">Nothing here.${
    filter.tier === 'done' ? ' No cases decided yet.' : ''}</div>`;
  [...$('rows').children].forEach(el => {
    if(!el.dataset || !el.dataset.id) return;
    el.onclick = () => select(el.dataset.id);
    el.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); select(el.dataset.id); } };
  });
}

function move(d){
  const i = filtered.findIndex(r => r.merchant_id === selected);
  const n = Math.max(0, Math.min(filtered.length - 1, i < 0 ? 0 : i + d));
  if(filtered[n]) select(filtered[n].merchant_id);
}
addEventListener('keydown', e => {
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    if(e.key === 'Escape') document.activeElement.blur();
    return;
  }
  if(e.key === 'ArrowDown' || e.key === 'j'){ e.preventDefault(); move(1); }
  if(e.key === 'ArrowUp' || e.key === 'k'){ e.preventDefault(); move(-1); }
  if(e.key === '/'){ e.preventDefault(); $('q').focus(); }
});

async function select(id){
  selected = id;
  [...$('rows').children].forEach(el => {
    if(el.classList) el.classList.toggle('sel', el.dataset && el.dataset.id === id);
  });
  const el = [...$('rows').children].find(x => x.dataset && x.dataset.id === id);
  if(el) el.scrollIntoView({block:'nearest'});
  let c = cache.get(id);
  if(!c){ c = await (await fetch('/api/card/' + id)).json(); cache.set(id, c); }
  draw(c); $('main').scrollTop = 0;
  openQueueDrawer(false);
  resetCopilot(c);
}
function reselect(){ const c = cache.get(selected); if(c) draw(c); }

function story(c){
  const by = {}; (c.decision.channels || []).forEach(ch => by[ch.channel] = ch);
  const declared = words(c.declared_category);
  const dissenting = Object.entries(c.vision || {})
    .find(([, v]) => v.vertical !== c.declared_category && v.vertical !== 'unknown');
  const bits = [`This merchant signed up as a <b>${esc(declared)}</b> business.`];
  if(dissenting){
    const [surface, v] = dissenting;
    bits.push(`Its <b>${esc(surface === 'checkout' ? 'checkout page' : 'homepage')}</b> now
      shows a <b>${esc(words(v.vertical))}</b> interface.`);
  }
  if(by.telemetry && by.telemetry.verdict === 'DISSENT')
    bits.push(`Its payments have <b>stopped looking like</b> a ${esc(declared)} merchant's.`);
  else if(by.telemetry)
    bits.push(`Its payments still look normal for a ${esc(declared)} merchant.`);
  if(by.scripts && by.scripts.verdict === 'DISSENT')
    bits.push(`Its checkout loads <b>code belonging to that other business</b>.`);
  if(by.infrastructure && by.infrastructure.verdict === 'DISSENT')
    bits.push(`It <b>shares rare payout details</b> with other merchant accounts.`);
  return bits.join(' ');
}

function phead(c){
  return `<div class="phead"><div>
    <h1>${esc(words(c.declared_category))} merchant</h1>
    <div class="sub"><span class="mono">${esc(c.merchant_id)}</span> · onboarded
      ${c.onboarded_days_ago} days ago</div></div>
    <div class="spacer"></div>
    <div class="viewtabs">
      <button class="vt" data-v="case" aria-pressed="${view === 'case'}">The case</button>
      <button class="vt" data-v="raw" aria-pressed="${view === 'raw'}">Full record</button>
    </div></div>`;
}

function identityPanel(c){
  const a = c.assessment;
  if(!a) return '';
  const CONF = {NONE:['ok','nothing to do'], WATCH:['', 'keep watching'],
    REVIEW:['warn','worth a look'], VERIFY:['warn','ask the merchant'],
    RESTRICT:['bad','enough to restrict payouts']};
  const [cls, note] = CONF[a.action_confidence] || ['', ''];

  const VIEW_SRC = {
    declared: ['Onboarding KYC', 'declared category'],
    payments: ['Payment telemetry', 'category baseline'],
    storefront: ['Website / storefront', 'vision classifier'],
    website: ['Website / storefront', 'vision classifier'],
    network: ['Shared setup', 'infrastructure graph'],
    statement: ['Verification call', 'merchant statement'],
    voice: ['Verification call', 'merchant statement'],
    scripts: ['Page code', 'third-party scripts'],
  };

  const views = (a.views || []).map(v => {
    const dissents = (a.contradictions || []).some(x => x.views.includes(v.view))
      && v.view !== 'declared';
    const cl = v.view === 'declared' ? 'declared' : dissents ? 'dissent'
      : !v.available ? 'blind' : '';
    let val = null;
    if(v.view === 'network' && (c.network || {}).in_cluster){
      const n = (c.network.size || 1) - 1;
      val = `${n} linked account${n === 1 ? '' : 's'}`;
    } else if(v.view === 'payments' && String(v.value || '').startsWith('not_')){
      val = 'atypical for its category';
    } else if(v.value && v.value !== 'cluster' && !String(v.value).startsWith('not_')){
      val = words(v.value);
    }
    // Prefer storefront surface when website dissent is from checkout/homepage
    let srcTags = VIEW_SRC[v.view] || [words(v.view)];
    if((v.view === 'storefront' || v.view === 'website') && c.vision){
      const mismatch = Object.entries(c.vision).find(([, x]) =>
        x.vertical && x.vertical !== c.declared_category);
      if(mismatch){
        const surface = mismatch[0] === 'checkout' ? 'checkout page' : 'homepage';
        srcTags = ['Website / storefront', surface, 'vision classifier'];
      }
    }
    if(v.view === 'payments' && ((c.telemetry || {}).deviations || [])[0]){
      const feat = words(c.telemetry.deviations[0].feature);
      srcTags = ['Payment telemetry', feat, 'category baseline'];
    }
    if(!v.available) srcTags = ['Not gathered this cycle'];
    const tipItems = srcTags.map(s => `<li>${esc(s)}</li>`).join('');
    const srcHtml = `<div class="src" tabindex="0">
      <button type="button" class="src-btn" aria-label="Show sources: ${esc(srcTags.join(', '))}">Source</button>
      <div class="src-tip" role="tooltip">
        <div class="th">Sources</div>
        <ul>${tipItems}</ul>
      </div></div>`;
    return `<div class="idrow ${cl}">
      <div class="k"><i></i>${esc(v.label)}</div>
      <div><div class="val">${val ? `<b>${esc(val)}</b>` : (v.available
        ? '<span style="color:var(--muted)">no clear reading</span>'
        : '<span style="color:var(--faint)">not gathered</span>')}</div>
        <div class="det">${esc(prose(v.detail))}</div>
        ${srcHtml}</div></div>`;
  }).join('');

  const contras = (a.contradictions || []).length
    ? (a.contradictions || []).map(x => `<div class="contra">
        <div class="cw"><span>${esc(x.between[0])} vs ${esc(x.between[1])}</span>
          <em>severity ${x.severity.toFixed(2)}</em></div>
        ${esc(prose(x.statement))}</div>`).join('')
    : `<p class="gt">No view contradicts the declaration.</p>`;

  const net = c.network || {};
  const netViz = net.in_cluster ? `
    <div class="netviz"><span class="netnode self">${esc(c.merchant_id)}</span>
      ${(net.members || []).slice(0, 8).map(m =>
        `<span class="netnode">${esc(m)}</span>`).join('')}</div>` : '';

  const voice = c.voice;
  const voicePanel = voice ? `
    <div class="panel"><div class="ph"><b>What the merchant said</b>
      <span>An automated verification call. It identifies itself, records the call,
        and the merchant can decline at any point.</span></div>
      <div class="body">
        ${voice.status !== 'answered'
          ? `<p class="gt">${voice.status === 'no_answer'
              ? 'The merchant did not answer. That counts neither for nor against them.'
              : 'The merchant declined and asked to speak to a person. That is their right and it is not evidence.'}</p>`
          : (voice.transcript || []).map(t => `<div class="callq ${esc(t.speaker)}">
              <div class="who">${t.speaker === 'agent' ? 'Sentinel' : 'Merchant'}</div>
              <div class="txt">${esc(t.text)}</div></div>`).join('')}
        ${voice.status === 'answered' ? `<div style="margin-top:13px">
          ${voice.consistent === null
            ? '<span class="badge badge-mute">no clear account of the business</span>'
            : voice.consistent
              ? '<span class="badge badge-money">restated its declared business</span>'
              : '<span class="badge badge-risk">contradicted its declaration</span>'}
          ${voice.contradiction ? `<p style="margin:9px 0 0;font-size:13.5px">${esc(prose(voice.contradiction))}</p>` : ''}
        </div>` : ''}
        <div class="guard"><b>What this call can never do.</b>
          <ul>${(voice.constraints || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
          It cannot change account status or hold funds. Only the gate can, and only
          with a second independent view.</div>
      </div></div>` : '';

  return `
    <div class="panel"><div class="ph"><b>Who this merchant says it is, and who it looks like</b>
      <span>Five readings of the same business, gathered five different ways. A merchant
        that quietly became something else cannot keep all five aligned.</span></div>
      <div class="body"><div class="idv">${views}</div></div></div>

    <div class="panel"><div class="ph"><b>Where the readings disagree</b>
      <span>${esc(a.summary)}</span></div>
      <div class="body">${contras}${netViz}</div></div>

    <div class="panel"><div class="ph"><b>How confident, and confident of what</b>
      <span>These are three different questions and the system keeps them apart.</span></div>
      <div class="body"><div class="conf3">
        <div class="c"><div class="n">${a.model_confidence.toFixed(2)}</div>
          <div class="label" style="margin-top:7px">Model confidence</div>
          <div class="d">How sure the models are. On its own this decides nothing.</div></div>
        <div class="c"><div class="n ${a.evidence_agreement >= 2 ? 'bad' : 'warn'}">${
          a.evidence_agreement} of ${a.independent_channels}</div>
          <div class="label" style="margin-top:7px">Independent views dissenting</div>
          <div class="d">How many separate readings disagree with the declaration.</div></div>
        <div class="c"><div class="n ${cls}" style="font-size:19px">${esc(a.action_confidence)}</div>
          <div class="label" style="margin-top:7px">Action confidence</div>
          <div class="d">What the evidence justifies doing — ${esc(note)}.</div></div>
      </div>
      ${(a.notes || []).map(n => `<p class="gt" style="margin-top:11px">${esc(prose(n))}</p>`).join('')}
      </div></div>

    ${voicePanel}`;
}

function draw(c){
  const d = c.decision, inv = c.investigation, t = c.telemetry, vis = c.vision || {};
  const tier = TIERS[d.tier] || TIERS[2];
  const ruling = rulings[c.merchant_id];

  if(view === 'raw'){
    $('main').innerHTML = `<div class="inner">${helpHTML()}${phead(c)}
      <div class="panel"><div class="ph"><b>Everything the system recorded</b>
        <span>Exactly what was written to disk for this case.</span></div>
        <pre class="raw">${esc(JSON.stringify(c, null, 2))}</pre></div></div>`;
    wire(c); return;
  }

  const nDissent = (d.dissenting_channels || []).length;
  const tampered = Object.values(vis).some(v => v.injection && v.injection.present);
  const checks = (d.channels || []).map(ch => {
    const meta = CHANNEL[ch.channel] || {n:ch.channel, q:() => '', s:''};
    const [label, cls] = answer(ch.channel, ch.verdict, tampered);
    return `<div class="check"><div class="c1"><span class="cn">${esc(meta.n)}</span>
      <span class="badge ${cls}">${esc(label)}</span></div>
      <p class="cq">${esc(meta.q(c.declared_category))}</p>
      <p class="ca">${esc(prose(ch.statement))}</p>
      <p class="cs">${esc(meta.s)}</p></div>`;
  }).join('');

  const surfaces = Object.entries(vis).map(([surface, v]) => {
    const matches = v.vertical === c.declared_category;
    return `<div class="surf"><div class="sh">
      <div class="sw">${esc(surface === 'checkout'
        ? 'Checkout page — where customers actually pay' : 'Homepage — the public front')}</div>
      <div class="sv">Reads as <b style="color:${matches ? 'var(--pos)' : 'var(--neg)'}">${
        esc(words(v.vertical))}</b>, ${(v.confidence * 100).toFixed(0)}% confident</div></div>
      <div class="shot"><div class="fb">loading the page…</div>
        <iframe title="${esc(surface)}" sandbox="" data-v="${esc(v.vertical)}"
          data-s="${esc(surface)}"></iframe><div class="cover"></div>
        <a class="open" href="/api/storefront/${esc(v.vertical)}/${esc(surface)}"
          target="_blank" rel="noopener">Open the real page ↗</a></div>
      <div class="find">${(v.findings || []).slice(0, 4).map(f => `
        <div><span class="label fe">${esc(f.element)}</span>${esc(prose(f.observation))}
          <span class="fi">${esc(prose(f.implication))}</span></div>`).join('')}
        ${v.injection && v.injection.present ? `<div style="color:var(--warn)">
          <span class="label fe">page tampering</span>${esc(v.injection.headline)}
          ${(v.injection.detail || []).slice(0, 1).map(x =>
            `<span class="fi mono">“${esc(x.quoted)}”</span>`).join('')}</div>` : ''}</div></div>`;
  }).join('');

  const top = t.deviations.slice(0, 7);
  const maxZ = Math.max(...top.map(r => Math.abs(r.z)), 1);
  const devs = top.map(r => {
    const w = Math.min(Math.abs(r.z) / maxZ, 1) * 44;
    const left = r.z >= 0 ? 50 : 50 - w;
    const big = Math.abs(r.z) >= 3;
    return `<div class="dev"><span>${esc(FEATURE[r.feature] || words(r.feature))}</span>
      <span class="v">${Number(r.value).toFixed(3)}</span>
      <span class="base">${Number(r.category_baseline).toFixed(3)}</span>
      <span class="zbar"><span class="z0"></span>
        <span class="fill${big ? ' hot' : ''}" style="left:${left}%;width:${w}%"></span></span>
      <span class="devlbl${big ? ' big' : ''}">${big ? 'far ' : ''}${r.z > 0 ? 'above' : 'below'}</span></div>`;
  }).join('');

  const steps = (inv.steps || []).map((s, i) => {
    const key = /Escalating instead/i.test(s.rationale);
    return `<div class="st${key ? ' key' : ''}"><div class="n2">${i + 1}</div><div>
      <div><span class="did">${esc(TOOLNAME[s.tool] || s.tool)}${
        s.args && s.args.surface ? ` — ${esc(s.args.surface)}` : ''}</span>
        <span class="label" style="margin-left:8px">${s.cost_inr ? '₹' + s.cost_inr.toFixed(2) : 'free'}</span></div>
      <p class="why">Why: ${esc(prose(s.rationale))}</p>
      <p class="ret">${esc(prose(s.returned))}</p>
      ${key ? `<div class="keyn"><b>This is the step that mattered.</b> A clean homepage would
        normally close the case here. The payment check disagreed, so it paid to look at the
        checkout page instead of closing.</div>` : ''}
      <p class="tool">${esc(s.tool)}(${esc(Object.entries(s.args || {})
        .map(([k, v]) => k + '=' + JSON.stringify(v)).join(', '))})</p></div></div>`;
  }).join('');

  $('main').innerHTML = `<div class="inner">
    ${helpHTML()}
    ${phead(c)}
    <div class="story${d.tier < 4 ? ' t2' : ''}">
      <span class="label" style="color:${d.tier < 4 ? 'var(--warn)' : 'var(--neg)'}">What we think is happening</span>
      <p class="txt">${story(c)}</p></div>

    <div class="act">
      <div class="ah"><span class="an">${esc(tier.a)}</span>
        <span class="badge ${d.tier >= 4 ? 'badge-risk' : 'badge-warn'}">${esc(tier.n)}</span></div>
      <p class="ad">${esc(tier.d)}</p>
      ${ruling ? `<div class="settled"><span>You marked this
          <b>${esc({uphold:'confirmed — action stands', release:'cleared — released',
            more_info:'waiting on more information'}[ruling.action] || ruling.action)}</b>
          on ${esc(ruling.at.replace('T', ' at '))}.</span>
          <button class="b" data-act="reopen">Reopen this case</button></div>`
      : `<div class="btns">

      <div class="body">

          <span class="label" style="text-align:right">this merchant</span>

          <span></span><span class="label">how far off</span></div>
        ${devs}</div></div>

    <div class="panel collapsible ev-panel ev-hidden" data-ev="trace"><div class="ph"><b>Investigation</b>
      <span>${inv.steps_used} of ${inv.step_budget} allowed steps ·
        ₹${(inv.total_cost_inr || 0).toFixed(2)} spent. Every step is recorded, in order.</span></div>
      <div class="body">${steps || '<p class="gt">Not investigated this cycle.</p>'}</div>
      <div class="stopb">Stopped because <b>${esc((inv.stop_reason || '').replace(/_/g, ' ')

        .replace('budget exhausted', 'it ran out of allowed steps')
        .replace('evidence exhausted', 'nothing further was worth checking'))}</b>.

        <div class="prov">Structured features only — never page copy.</div>

        <b style="color:${c.ground_truth.label ? 'var(--neg)' : 'var(--pos)'}">${
          c.ground_truth.label ? 'yes' : 'no'}</b> ·
        ${esc(words(c.ground_truth.archetype))}</p></div></div>
  </div>`;

  wire(c);
  document.querySelectorAll('.act [data-act]').forEach(b => b.onclick = () => rule(c, b.dataset.act));
  document.querySelectorAll('.shot iframe').forEach(f => {
    fetch(`/api/storefront/${f.dataset.v}/${f.dataset.s}`)
      .then(r => r.ok ? r.text() : null).then(h => { if(h) f.srcdoc = h; }).catch(() => {});
  });
}

async function rule(c, action){
  try{
    const noteEl = document.getElementById('decnote');
    const note = (noteEl && noteEl.value || lastMemo || '').trim().slice(0, 500);
    const r = await fetch('/api/decision', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({merchant_id:c.merchant_id, action, note})});
    if(!r.ok) throw new Error();
    const j = await r.json();
    if(action === 'reopen') delete rulings[c.merchant_id]; else rulings[c.merchant_id] = j.state;
    toast(action === 'reopen' ? 'Case reopened.' : 'Decision recorded.');
    paintHeader(); apply(); draw(c);
  }catch(e){ toast('Could not save that decision.'); }
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast slide-in'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
function wire(c){
  document.querySelectorAll('.vt').forEach(b => b.onclick = () => { view = b.dataset.v; draw(c); });
  const x = $('helpclose');
  if(x) x.onclick = () => {
    helpOn = false;
    try{ localStorage.setItem('sentinel-help', 'dismissed'); }catch(e){}
    draw(c);
  };
  wireCollapse();
  const dm = $('draftmemo');
  if(dm) dm.onclick = () => {
    const act = document.querySelector('.act');
    const box = $('notenbox');
    const open = !(act && act.classList.contains('note-open'));
    if(act) act.classList.toggle('note-open', open);
    if(box) box.hidden = !open;
    dm.setAttribute('aria-expanded', open ? 'true' : 'false');
    dm.classList.toggle('on', open);
    if(open){
      const ta = $('decnote');
      if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }
  };
  const af = $('aifillnote');
  if(af) af.onclick = () => {
    const act = document.querySelector('.act');
    const box = $('notenbox');
    if(act) act.classList.add('note-open');
    if(box) box.hidden = false;
    if(dm){ dm.setAttribute('aria-expanded', 'true'); dm.classList.add('on'); }
    askCopilot('Draft my decision note');
  };
  const aw = $('askwhy');
  if(aw) aw.onclick = () => askCopilot('Why is this recommended?');
  const sg = $('startguide');
  if(sg) sg.onclick = () => {
    openCopilotMobile(true);
    askCopilot('Walk me through this case');
    if(guideSteps[0]){ guideActive = guideSteps[0].id; paintGuide(guideSteps); }
  };
  const as = $('asksafe');
  if(as) as.onclick = () => { openCopilotMobile(true); askCopilot('Is it safe to release?'); };
  const evnav = $('evnav');
  if(evnav){
    const paintEv = (b) => {
      const btns = [...evnav.querySelectorAll('button[data-ev]')];
      const i = Math.max(0, btns.indexOf(b));
      btns.forEach((x, n) => {
        x.classList.toggle('on', x === b);
        x.classList.toggle('done', n < i);
      });
      evnav.style.setProperty('--ev-progress', (btns.length > 1 ? (i / (btns.length - 1)) * 83.3 : 0) + '%');
      const id = b.dataset.ev;
      document.querySelectorAll('.ev-panel').forEach(p => {
        const show = p.dataset.ev === id;
        p.classList.toggle('ev-hidden', !show);
        if(p.dataset.ev === 'identity') p.style.display = show ? '' : 'none';
      });
    };
    evnav.querySelectorAll('button[data-ev]').forEach(b => {
      b.onclick = () => { if(!b.disabled) paintEv(b); };
    });
    paintEv(evnav.querySelector('button.on') || evnav.querySelector('button[data-ev]'));
  }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function channelLabel(ch){
  return ({telemetry:'payments', storefront:'website', scripts:'page code',
    infrastructure:'shared setup', statement:"the merchant's statement",
    page_integrity:'page tampering'}[ch] || words(ch));
}

function mockIntent(q){
  const t = q.toLowerCase();
  if(/\b(draft|memo|note|write|document)\b/.test(t)) return 'memo';
  if(/\b(walk|guide|step|tour|explain (the )?case|how (do|should) i)\b/.test(t)) return 'walkthrough';
  if(/\b(safe to release|clear|release|false positive|wrong)\b/.test(t)) return 'release';
  if(/\b(why|recommend|tier|action|hold|restrict|freeze)\b/.test(t)) return 'why';
  if(/\b(website|storefront|checkout|homepage|page|vertical)\b/.test(t)) return 'vision';
  if(/\b(channel|dissent|disagree|contradict|agree)\b/.test(t)) return 'channels';
  if(/\b(payment|telemetry|feature|sigma|velocity|refund|chargeback)\b/.test(t)) return 'payments';
  if(/\b(network|link|cluster|ring|shared|infrastructure|who is it)\b/.test(t)) return 'network';
  if(/\b(call|voice|statement|said|merchant said)\b/.test(t)) return 'voice';
  if(/\b(second channel|two.?channel|gate)\b/.test(t)) return 'gate';
  return 'general';
}

function mockSuggestions(c){
  const out = [
    'Why is this recommended?',
    'Which channels disagree?',
    'Is it safe to release?',
  ];
  if(c.vision) out.push('What does the website show?');
  if((c.network || {}).in_cluster) out.push('Who is it linked to?');
  if(c.voice) out.push('What did the merchant say on the call?');
  out.push('Draft my decision note');
  return [...new Set(out)].slice(0, 6);
}

function mockReply(c, question){
  const q = String(question || '').trim();
  const intent = mockIntent(q);
  const mid = c.merchant_id;
  const declared = words(c.declared_category);
  const d = c.decision || {};
  const tier = TIERS[d.tier] || TIERS[2];
  const dissent = d.dissenting_channels || [];
  const dissentNames = dissent.map(channelLabel);
  const second = d.second_channel_source ? channelLabel(d.second_channel_source) : null;
  const held = d.tier >= 4;
  const vis = c.vision || {};
  const surfaces = Object.entries(vis);
  const mismatch = surfaces.find(([, v]) => v.vertical && v.vertical !== c.declared_category);
  const voice = c.voice || {};
  const net = c.network || {};
  const topDev = ((c.telemetry || {}).deviations || [])[0];
  const suggestions = mockSuggestions(c);
  const declaredSrc = 'declared category';
  let answer = '';
  let sources = [];

  if(intent === 'why'){
    sources = held
      ? [declaredSrc, 'website', second || 'second channel', 'two-channel gate'].filter(Boolean)
      : [declaredSrc, ...dissentNames, 'two-channel gate'];
    answer = held
      ? `${mid} is recommended for ${tier.n} because two independent views disagree with its declaration as ${declared}. `
        + `The website reading and ${second || 'a second channel'} both contradict the onboarding category. `
        + `A single channel would never be enough to freeze settlements — the gate requires both.`
      : `${mid} is queued as ${tier.n}. ${dissentNames.length
        ? dissentNames.join(' and ') + (dissentNames.length === 1 ? ' disagrees' : ' disagree')
          + ` with the ${declared} declaration, but that is not enough to hold money.`
        : 'The evidence does not yet clear the two-channel bar.'} `
        + `Settlements keep running while you review.`;
  } else if(intent === 'release'){
    sources = held
      ? ['website', second || 'second channel', 'two-channel gate']
      : [...dissentNames, 'two-channel gate'];
    answer = held
      ? `No — it is not safe to release yet. Settlements are frozen because website + ${second || 'a second view'} both dissent. `
        + `Clearing now would restart payouts while those contradictions still stand. Confirm the hold, or request more information if you need a human callback.`
      : `Yes — releasing (or leaving payouts running) matches the gate. Only ${dissentNames.length || 0} independent view`
        + `${dissentNames.length === 1 ? '' : 's'} dissent, and holds need website plus one other. `
        + `You can clear the merchant or keep reviewing without freezing money.`;
  } else if(intent === 'channels'){
    sources = dissentNames.length
      ? [...dissentNames, 'channel verdicts']
      : [declaredSrc, 'channel verdicts'];
    answer = dissentNames.length
      ? `These channels disagree with the declared ${declared} business: ${dissentNames.join(', ')}. `
        + (held
          ? `Because website is among them and ${second || 'another channel'} corroborates, the gate allows a settlement hold.`
          : `Website alone — or any single channel — can only ask for review, never freeze payouts.`)
      : `No channel currently contradicts the ${declared} declaration. There is nothing for the two-channel gate to act on.`;
  } else if(intent === 'vision'){
    sources = mismatch
      ? ['website / storefront', mismatch[0], declaredSrc]
      : surfaces.length ? ['website / storefront', declaredSrc] : ['evidence card'];
    if(mismatch){
      const [surface, v] = mismatch;
      answer = `The ${surface === 'checkout' ? 'checkout page' : 'homepage'} reads as ${words(v.vertical)} `
        + `(${Math.round((v.confidence || 0) * 100)}% confidence), not ${declared}. `
        + `That storefront dissent is what the gate needs before a second channel can justify a hold.`;
    } else if(surfaces.length){
      answer = `The live pages still look like ${declared}. Storefront does not currently dissent — so even if another channel looks odd, settlements cannot be frozen on that alone.`;
    } else {
      answer = `No storefront reading is on this card yet. Without a website view, the gate cannot restrict payouts.`;
    }
  } else if(intent === 'payments'){
    sources = topDev
      ? ['payments / telemetry', words(topDev.feature), declaredSrc + ' baseline']
      : ['payments / telemetry'];
    if(topDev){
      answer = `Payment behaviour is atypical for ${declared}. Largest deviation: ${words(topDev.feature)} `
        + `at ${topDev.z > 0 ? '+' : ''}${Number(topDev.z).toFixed(1)}σ versus the category baseline. `
        + (dissent.includes('telemetry')
          ? 'Telemetry is a dissenting channel on this card.'
          : 'Telemetry is recorded, but it is not the dissenting vote that clears the gate by itself.');
    } else {
      answer = `No strong payment deviations are listed for ${mid}. Telemetry is not carrying a dissent on this case.`;
    }
  } else if(intent === 'network'){
    sources = net.in_cluster
      ? ['network / shared setup', 'cluster members']
      : ['network / shared setup'];
    answer = net.in_cluster
      ? `${mid} sits in a cluster with ${(net.size || 1) - 1} other linked account(s)`
        + `${(net.members || []).length ? ' including ' + (net.members || []).slice(0, 3).join(', ') : ''}. `
        + `Shared setup can corroborate a website dissent when the gate needs a second channel.`
      : `${mid} is not linked to other merchants by a rare shared identity. Network is not a dissenting channel here.`;
  } else if(intent === 'voice'){
    sources = voice && voice.status
      ? ["merchant statement / voice call", declaredSrc]
      : ['evidence card'];
    if(!voice || !voice.status){
      answer = `No verification call is on this card for ${mid}.`;
    } else if(voice.status === 'answered'){
      answer = voice.consistent === false
        ? `On the call, the merchant contradicted its ${declared} declaration`
          + `${voice.contradiction ? ': ' + prose(voice.contradiction) : '.'} That statement can support review, but it never holds funds alone.`
        : voice.consistent
          ? `On the call, the merchant restated a ${declared} business. That does not clear other dissenting channels.`
          : `The merchant answered but gave no clear account of the business. That is neither for nor against a hold.`;
    } else if(voice.status === 'no_answer'){
      answer = `The merchant did not answer the verification call. That counts neither for nor against them.`;
    } else {
      answer = `The merchant declined the call and asked for a person. That is their right and it is not evidence.`;
    }
  } else if(intent === 'gate'){
    sources = ['two-channel gate', ...dissentNames.slice(0, 3)];
    answer = `Holds need website + one other independent view. Model confidence alone never freezes money. `
      + `Right now ${dissentNames.length} of 5 views disagree`
      + `${held ? `, and the second channel is ${second || 'recorded on the card'}` : ''}.`;
  } else if(intent === 'memo'){
    sources = held
      ? [declaredSrc, 'website', second || 'second channel', 'two-channel gate']
      : [declaredSrc, ...dissentNames, 'two-channel gate'];
    answer = held
      ? `Decision note: Confirm settlement restriction for ${mid}. Declared ${declared}; `
        + `website and ${second || 'a second channel'} both dissent (${dissentNames.join(', ') || 'see card'}). `
        + `Two-channel gate satisfied. Pending human review — detection and flagging only.`
      : `Decision note: ${tier.a} for ${mid}. Declared ${declared}. `
        + `${dissentNames.length ? 'Dissenting: ' + dissentNames.join(', ') + '. ' : ''}`
        + `Two-channel bar for a hold is not met; settlements continue.`;
  } else if(intent === 'walkthrough'){
    sources = ['evidence card', 'guided review checklist'];
    answer = `Start with the story for ${mid}, then the five readings. `
      + `Check whether website dissents, then whether a second channel agrees. `
      + `Ask “Is it safe to release?” before you Confirm, Clear, or request more information.`;
  } else {
    sources = dissentNames.length
      ? [declaredSrc, ...dissentNames]
      : [declaredSrc, 'payments', 'website', 'network', 'statement'];
    answer = `On ${mid}, Sentinel compared the ${declared} declaration with payments, website, network, and statement. `
      + `${dissentNames.length
        ? 'Disagreement shows up in: ' + dissentNames.join(', ') + '.'
        : 'No hard dissent is flagged on the card.'} `
      + `Ask why it was recommended, which channels disagree, or whether it is safe to release.`;
  }

  // Dedupe while preserving order; keep human-readable labels only
  const seen = new Set();
  sources = sources.filter(s => {
    const k = String(s).toLowerCase();
    if(!s || seen.has(k)) return false;
    seen.add(k);
    return true;
  }).slice(0, 5);

  return {
    answer,
    provenance: 'Structured findings only — never page copy',
    sources,
    suggestions,
    intent,
  };
}

async function askServer(mid, question){
  const r = await fetch('/api/ask', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({merchant_id: mid, question})
  });
  if(!r.ok) throw new Error('ask failed');
  return r.json();
}

async function askCopilot(question){
  if(chatBusy) return;
  if(!selected){
    toast('Pick a merchant from the queue first.');
    openCopilotMobile(false);
    return;
  }
  const q = String(question || '').trim();
  if(!q) return;
  openCopilotMobile(true);
  chatBusy = true;
  const send = $('chsend');
  if(send) send.disabled = true;
  meSay(q);
  const input = $('chq');
  if(input) input.value = '';
  const think = botThinking();
  try{
    const c = cache.get(selected);
    const mock = c ? mockReply(c, q) : null;
    const [, j] = await Promise.all([
      sleep(2000),
      mock ? Promise.resolve(mock) : askServer(selected, q),
    ]);
    think.remove();
    botSay(j.answer || 'No answer returned.', j.provenance || 'Structured findings only — never page copy', j.sources);
    if(j.suggestions) paintSuggestions(j.suggestions);
    if(j.guide) paintGuide(j.guide);
    if(j.intent === 'memo'){
      lastMemo = j.answer;
      const ta = document.getElementById('decnote');
      const box = document.getElementById('notenbox');
      const act = document.querySelector('.act');
      const dm = document.getElementById('draftmemo');
      if(act) act.classList.add('note-open');
      if(box) box.hidden = false;
      if(dm){ dm.setAttribute('aria-expanded', 'true'); dm.classList.add('on'); }
      if(ta){
        ta.value = j.answer;
        ta.focus();
      }
    }
    const hit = guideSteps.find(s => s.ask && s.ask.toLowerCase() === q.toLowerCase());
    if(hit){ guideDone.add(hit.id); paintGuide(guideSteps); }
  }catch(e){
    console.warn(e);
    think.remove();
    botSay('Could not reach the copilot. Is the API running?', '');
  }
  chatBusy = false;
  if(send) send.disabled = false;
  if(input) input.focus();
}

function paintSuggestions(list){
  $('chipsask').innerHTML = (list || []).map(s =>
    `<button type="button">${esc(s)}</button>`).join('');
  [...$('chipsask').children].forEach(b => {
    b.onclick = () => askCopilot(b.textContent);
  });
}

async function loadGuide(mid){
  try{
    const j = await (await fetch('/api/guide/' + mid)).json();
    guideSteps = j.steps || [];
    paintGuide(guideSteps);
    if(j.suggestions) paintSuggestions(j.suggestions);
  }catch(e){
    $('guidesteps').innerHTML = '<div style="font-size:12.5px;color:var(--faint)">Guide unavailable.</div>';
  }
}

function paintGuide(steps){
  guideSteps = steps || guideSteps;
  if(!guideSteps.length){
    $('guidesteps').innerHTML = '<div style="font-size:12.5px;color:var(--faint)">No steps.</div>';
    return;
  }
  $('guidesteps').innerHTML = guideSteps.map((s, i) => {
    const done = guideDone.has(s.id);
    const active = guideActive === s.id;
    return `<div class="gstep${done?' done':''}${active?' active':''}" data-id="${esc(s.id)}" data-ask="${esc(s.ask || '')}">
      <div class="gn">${done ? '✓' : (i+1)}</div>
      <div><div class="gt">${esc(s.title)}</div><div class="gd">${esc(s.detail)}</div></div></div>`;
  }).join('');
  [...$('guidesteps').children].forEach(el => {
    el.onclick = () => {
      guideActive = el.dataset.id;
      paintGuide(guideSteps);
      if(el.dataset.ask) askCopilot(el.dataset.ask);
      // scroll main to matching panel
      const map = {story:'.story', identity:'.panel', website:'.surfaces', payments:'.dev', gate:'.gaterule', decide:'.act'};
      const sel = map[el.dataset.id];
      const target = sel && document.querySelector(sel);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
}

$('chform').onsubmit = e => { e.preventDefault(); askCopilot($('chq').value); };

function wireCollapse(){
  document.querySelectorAll('.panel.collapsible > .ph').forEach(ph => {
    ph.onclick = () => ph.parentElement.classList.toggle('closed');
  });
}

addEventListener('keydown', e => {
  if(e.key === '?' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault();
    openCopilotMobile(true);
    $('chq').focus();
  }
});


/* ---- Voice AI (Web Speech) + Demo Mode ---- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceSpeak = localStorage.getItem('sentinel-speak') === '1';
let recognizing = false, recognition = null;

function setVstat(msg, kind){
  const el = $('vstat');
  if(!el) return;
  const text = String(msg || '').trim();
  el.textContent = text;
  el.classList.toggle('on', !!text);
  el.classList.toggle('warn', kind === 'warn');
  el.classList.toggle('live', kind === 'live');
}

function speak(text){
  if(!voiceSpeak || !window.speechSynthesis) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).slice(0, 600));
    u.rate = 1.05; u.pitch = 1;
    const voices = speechSynthesis.getVoices();
    const pick = voices.find(v => /en(-|_)?(US|GB|IN)?/i.test(v.lang) && /Google|Natural|Neural|Samantha|Zira/i.test(v.name))
      || voices.find(v => /^en/i.test(v.lang));
    if(pick) u.voice = pick;
    speechSynthesis.speak(u);
  }catch(e){}
}

function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }


const gt = $('guidetoggle');
if(gt) gt.onclick = () => {
  document.body.classList.toggle('guide-open');
  gt.textContent = document.body.classList.contains('guide-open')
    ? 'Guided review ▾' : 'Guided review ▸';
};

function initVoice(){
  const mic = $('micbtn'), sp = $('speakbtn');
  if(!mic || !sp) return;
  if(voiceSpeak){ sp.classList.add('on'); sp.setAttribute('aria-pressed', 'true'); }
  sp.onclick = () => {
    voiceSpeak = !voiceSpeak;
    try{ localStorage.setItem('sentinel-speak', voiceSpeak ? '1' : '0'); }catch(e){}
    sp.classList.toggle('on', voiceSpeak);
    sp.setAttribute('aria-pressed', voiceSpeak ? 'true' : 'false');
    setVstat(voiceSpeak ? 'Answers will be read aloud' : '', voiceSpeak ? 'live' : '');
    if(!voiceSpeak) stopSpeak();
    else setTimeout(() => setVstat(''), 1600);
  };
  if(!SpeechRec){
    mic.disabled = true;
    mic.title = 'Speech recognition needs Chrome or Edge';
    return;
  }
  recognition = new SpeechRec();
  recognition.lang = 'en-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onstart = () => {
    recognizing = true; mic.classList.add('hot');
    setVstat('Listening…', 'live');
  };
  recognition.onend = () => {
    recognizing = false; mic.classList.remove('hot');
    setVstat('');
  };
  recognition.onerror = (e) => {
    recognizing = false; mic.classList.remove('hot');
    setVstat(e.error === 'not-allowed'
      ? 'Mic blocked — allow microphone for this site'
      : 'Could not hear that — try again', 'warn');
  };
  recognition.onresult = (ev) => {
    const said = (ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript || '').trim();
    if(said){
      setVstat('');
      askCopilot(said);
    }
  };
  mic.onclick = () => {
    if(!selected){ toast('Pick a merchant from the queue first.'); return; }
    stopSpeak();
    if(recognizing){ try{ recognition.stop(); }catch(e){} return; }
    try{ recognition.start(); }catch(e){ setVstat('Mic busy — tap again', 'warn'); }
  };
}

// Wrap botSay to also speak
function enableSpeakOnBot(){
  const prev = botSay;
  botSay = function(text, prov, sources){
    prev(text, prov, sources);
    if(prov !== 'structured-features-only (prompt)') speak(text);
  };
}

enableSpeakOnBot();
initVoice();

const _boot = boot;
boot = async function(){
  await _boot();
  if(!selected){
    $('main').innerHTML = `<div class="empty start-empty">
      <h2>Review who a merchant is today</h2>
      <p>Sentinel already investigated these accounts. Your job is to decide —
        confirm the action, clear the merchant, or ask for more information.</p>
      <ol>
        <li>Pick a case from the queue.</li>
        <li>Ask the copilot — type, or use the mic in Chrome.</li>
        <li>Record a decision with an AI-drafted note.</li>
      </ol>
      <button class="b go" type="button" id="emptyfirst">Open top case</button>
    </div>`;
    const ef = $('emptyfirst');
    if(ef) ef.onclick = () => { if(filtered[0]) select(filtered[0].merchant_id); };
  }
};
boot();
